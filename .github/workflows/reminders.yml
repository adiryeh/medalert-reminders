name: MedAlert reminder sender

on:
  schedule:
    # GitHub throttles scheduled workflows heavily on low-activity repos — observed gaps
    # of 2-5 hours in practice at */5, not the requested 5 minutes. Trying */15 as a free,
    # zero-new-account experiment before moving to an external trigger (cron-job.org).
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab, for testing

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-action
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm start
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
