name: MedAlert reminder sender

on:
  # GitHub's own `schedule:` trigger was tried at both */5 and */15 and throttled heavily on
  # this low-activity repo regardless — observed gaps of 3-7 hours in practice. Removed.
  # An external service (cron-job.org) now calls the GitHub API to fire workflow_dispatch
  # on a real 5-minute cadence instead of relying on GitHub's own (unreliable) scheduler.
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-action
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm start
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
